[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "style-figures"
version = "0.1.2"
description = "A shared scientific figure style for MATLAB and Matplotlib"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/mvazcar/style-figures"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]

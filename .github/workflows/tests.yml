name: Figure checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests/python examples/python_panels.py
      - run: python -m build
  matlab:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd); results = runtests('tests/matlab'); assertSuccess(results)
  r:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e "install.packages(c('ggplot2', 'systemfonts', 'ragg'))"
      - run: Rscript tests/r/test_figure_style.R
      - run: Rscript examples/r_panels.R
